<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问日志 Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.8em;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .container {
            padding: 30px 50px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-title {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .chart-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .chart-container {
            height: 300px;
        }
        .lists-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
        }
        .list-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .list-title {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item-key {
            color: #555;
            font-size: 0.9em;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .list-item-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
        @media (max-width: 1024px) {
            .charts-grid, .lists-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>访问日志 Dashboard - 最近 1 小时</h1>
        <a href="/" class="back-btn">返回首页</a>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">总请求数</div>
                <div class="stat-value" id="total-requests">-</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">访问趋势（每 5 分钟）</div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">Top IP 分布</div>
                <div class="chart-container">
                    <canvas id="ipChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="lists-grid">
            <div class="list-card">
                <div class="list-title">Top 10 IP 地址</div>
                <div id="top-ips-list"></div>
            </div>
            <div class="list-card">
                <div class="list-title">Top 10 访问路径</div>
                <div id="top-paths-list"></div>
            </div>
            <div class="list-card">
                <div class="list-title">Top 10 User Agent</div>
                <div id="top-uas-list"></div>
            </div>
        </div>
    </div>
    
    <script>
        let trendChart = null;
        let ipChart = null;
        
        function renderEmptyState(container) {
            container.innerHTML = '<div class="empty-state">暂无数据<br>请刷新首页生成访问日志</div>';
        }
        
        function renderList(container, items, keyField) {
            if (items.length === 0) {
                renderEmptyState(container);
                return;
            }
            
            container.innerHTML = items.map(item => `
                <div class="list-item">
                    <span class="list-item-key" title="${item[keyField]}">${item[keyField]}</span>
                    <span class="list-item-count">${item.count}</span>
                </div>
            `).join('');
        }
        
        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (trendChart) {
                trendChart.destroy();
            }
            
            if (data.length === 0) {
                return;
            }
            
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.time),
                    datasets: [{
                        label: '请求数',
                        data: data.map(d => d.count),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#667eea',
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }
        
        function renderIpChart(data) {
            const ctx = document.getElementById('ipChart').getContext('2d');
            
            if (ipChart) {
                ipChart.destroy();
            }
            
            if (data.length === 0) {
                return;
            }
            
            const colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c',
                '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                '#fa709a', '#fee140'
            ];
            
            ipChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.map(d => d.ip),
                    datasets: [{
                        data: data.map(d => d.count),
                        backgroundColor: colors.slice(0, data.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right'
                        }
                    }
                }
            });
        }
        
        function fetchDashboardData() {
            fetch('/api/dashboard-data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total-requests').textContent = data.total_requests;
                    
                    renderTrendChart(data.requests_over_time);
                    renderIpChart(data.top_ips);
                    
                    renderList(document.getElementById('top-ips-list'), data.top_ips, 'ip');
                    renderList(document.getElementById('top-paths-list'), data.top_paths, 'path');
                    renderList(document.getElementById('top-uas-list'), data.top_user_agents, 'user_agent');
                })
                .catch(error => {
                    console.error('获取数据失败:', error);
                });
        }
        
        fetchDashboardData();
        setInterval(fetchDashboardData, 10000);
    </script>
</body>
</html>
