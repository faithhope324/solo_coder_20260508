<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST 自动编码器可视化</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #fff;
            border-bottom: 2px solid #3a7bd5;
            padding-bottom: 10px;
        }

        #plot {
            width: 100%;
            height: 500px;
        }

        .upload-section {
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed #3a7bd5;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(58, 123, 213, 0.1);
        }

        .upload-area:hover, .upload-area.dragover {
            background: rgba(58, 123, 213, 0.2);
            border-color: #00d2ff;
        }

        .upload-area p {
            color: #aaa;
            margin: 10px 0;
        }

        .upload-icon {
            font-size: 3rem;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(45deg, #3a7bd5, #00d2ff);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .image-preview {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .preview-item {
            flex: 1;
            text-align: center;
        }

        .preview-item h4 {
            margin-bottom: 10px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .preview-item img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .similar-grid {
            margin-top: 15px;
        }

        .similar-title {
            margin-bottom: 15px;
            color: #ccc;
        }

        .similar-images {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .similar-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .similar-item canvas {
            width: 80px;
            height: 80px;
            image-rendering: pixelated;
            border-radius: 4px;
        }

        .similar-item .label {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .similar-item .distance {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
        }

        .encoding-info {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .encoding-info p {
            margin: 5px 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        .encoding-info strong {
            color: #00d2ff;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00d2ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff6b6b;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .similar-images {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MNIST 自动编码器 2D 降维可视化</h1>
            <p>上传手写数字图片，查看其在潜在空间中的位置及相似数字</p>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2>潜在空间散点图 (测试集 10,000 样本)</h2>
                <div id="plot"></div>
            </div>

            <div class="card">
                <h2>图片上传与分析</h2>
                
                <div class="upload-section">
                    <div class="upload-area" id="dropZone">
                        <div class="upload-icon">📁</div>
                        <p>拖拽图片到这里，或点击选择图片上传</p>
                        <p style="font-size: 0.85rem;">支持 PNG、JPG 格式</p>
                        <input type="file" id="fileInput" accept="image/*">
                        <button class="btn" id="selectBtn" style="margin-top: 15px;">选择图片</button>
                    </div>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p id="loadingText">正在分析图片中...</p>
                </div>

                <div class="error-message" id="errorMessage"></div>
                <div class="error-message" id="warningMessage" style="background: rgba(255, 193, 7, 0.1); color: #ffc107; display: none;"></div>

                <div class="image-preview" id="imagePreview" style="display: none;">
                    <div class="preview-item">
                        <h4>原始图片</h4>
                        <img id="uploadedImg" alt="上传的图片">
                    </div>
                    <div class="preview-item">
                        <h4>预处理后 (28x28)</h4>
                        <img id="processedImg" alt="预处理后的图片">
                    </div>
                </div>

                <div class="encoding-info" id="encodingInfo" style="display: none;">
                    <p><strong>2D 编码坐标:</strong> <span id="encodingCoords"></span></p>
                </div>

                <div class="similar-section" id="similarSection" style="display: none;">
                    <h3 class="similar-title">最相似的 8 张图片 (按距离排序)</h3>
                    <div class="similar-images" id="similarImages"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allTraces = [];
        let redPointIndex = -1;

        async function initPlot() {
            try {
                const response = await fetch('/api/plot-data');
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                allTraces = data.traces;
                renderPlot();
            } catch (error) {
                document.getElementById('errorMessage').textContent = '加载图表数据失败: ' + error.message;
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        function renderPlot() {
            const layout = {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0.1)',
                xaxis: {
                    title: '维度 1',
                    gridcolor: 'rgba(255,255,255,0.1)',
                    color: '#aaa',
                    titlefont: { color: '#aaa' }
                },
                yaxis: {
                    title: '维度 2',
                    gridcolor: 'rgba(255,255,255,0.1)',
                    color: '#aaa',
                    titlefont: { color: '#aaa' }
                },
                legend: {
                    font: { color: '#aaa' },
                    bgcolor: 'rgba(0,0,0,0.5)'
                },
                margin: { l: 50, r: 20, t: 20, b: 50 },
                hovermode: 'closest'
            };

            const config = {
                responsive: true,
                displayModeBar: true
            };

            Plotly.newPlot('plot', allTraces, layout, config);
        }

        function addRedPoint(x, y) {
            const redTrace = {
                x: [x],
                y: [y],
                mode: 'markers',
                name: '新图片',
                marker: {
                    color: '#ff3b3b',
                    size: 15,
                    symbol: 'circle',
                    line: {
                        color: '#ffffff',
                        width: 2
                    }
                },
                type: 'scatter'
            };

            if (redPointIndex >= 0) {
                Plotly.deleteTraces('plot', redPointIndex);
                redPointIndex--;
            }

            Plotly.addTraces('plot', redTrace);
            redPointIndex = allTraces.length;
            allTraces.push(redTrace);
        }

        function drawImageGrid(images) {
            const container = document.getElementById('similarImages');
            container.innerHTML = '';

            images.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'similar-item';
                
                const canvas = document.createElement('canvas');
                canvas.width = 28;
                canvas.height = 28;
                const ctx = canvas.getContext('2d');
                
                const imgData = ctx.createImageData(28, 28);
                for (let i = 0; i < 28; i++) {
                    for (let j = 0; j < 28; j++) {
                        const pixel = img.image[i][j];
                        const idx = (i * 28 + j) * 4;
                        imgData.data[idx] = pixel;
                        imgData.data[idx + 1] = pixel;
                        imgData.data[idx + 2] = pixel;
                        imgData.data[idx + 3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                item.innerHTML = `
                    <div style="width: 80px; height: 80px; margin: 0 auto;">
                        <canvas style="width: 80px; height: 80px; image-rendering: pixelated; border-radius: 4px;"></canvas>
                    </div>
                    <div class="label">数字: ${img.label}</div>
                    <div class="distance">距离: ${img.distance.toFixed(4)}</div>
                `;
                item.querySelector('canvas').getContext('2d').drawImage(canvas, 0, 0);

                container.appendChild(item);
            });
        }

        async function handleFile(file) {
            const MAX_FILE_SIZE = 10 * 1024 * 1024;
            const TIMEOUT_MS = 30000;

            if (file.size > MAX_FILE_SIZE) {
                document.getElementById('errorMessage').textContent = 
                    `图片过大 (${(file.size / 1024 / 1024).toFixed(2)} MB)，请上传小于 10 MB 的图片`;
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                document.getElementById('loadingText').textContent = 
                    `图片较大 (${(file.size / 1024 / 1024).toFixed(2)} MB)，正在处理中，请稍候...`;
            } else {
                document.getElementById('loadingText').textContent = '正在分析图片中...';
            }

            const formData = new FormData();
            formData.append('image', file);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('warningMessage').style.display = 'none';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('encodingInfo').style.display = 'none';
            document.getElementById('similarSection').style.display = 'none';

            const controller = new AbortController();
            const timeoutId = setTimeout(() => {
                controller.abort();
            }, TIMEOUT_MS);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                if (data.warnings && data.warnings.length > 0) {
                    document.getElementById('warningMessage').textContent = 
                        '⚠️ ' + data.warnings.join('；');
                    document.getElementById('warningMessage').style.display = 'block';
                }

                document.getElementById('uploadedImg').src = 'data:image/png;base64,' + data.uploaded_image;
                document.getElementById('processedImg').src = 'data:image/png;base64,' + data.processed_image;
                document.getElementById('imagePreview').style.display = 'flex';

                document.getElementById('encodingCoords').textContent = 
                    `(${data.encoding[0].toFixed(4)}, ${data.encoding[1].toFixed(4)})`;
                document.getElementById('encodingInfo').style.display = 'block';

                addRedPoint(data.encoding[0], data.encoding[1]);

                drawImageGrid(data.similar_images);
                document.getElementById('similarSection').style.display = 'block';

            } catch (error) {
                if (error.name === 'AbortError') {
                    document.getElementById('errorMessage').textContent = 
                        '请求超时，请尝试上传较小的图片；或检查网络连接';
                } else {
                    document.getElementById('errorMessage').textContent = '上传失败: ' + error.message;
                }
                document.getElementById('errorMessage').style.display = 'block';
            } finally {
                clearTimeout(timeoutId);
                document.getElementById('loading').style.display = 'none';
            }
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');

        selectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        initPlot();
    </script>
</body>
</html>
