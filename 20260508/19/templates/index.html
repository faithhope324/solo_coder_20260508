<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交网络图可视化</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .upload-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .file-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .file-group {
            display: flex;
            flex-direction: column;
        }

        .file-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .file-group input[type="file"] {
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .file-group input[type="file"]:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: block;
            margin: 0 auto;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9rem;
        }

        .chart-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .zoom-label {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .zoom-btn {
            background: #f0f4ff;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .zoom-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-1px);
        }

        .zoom-btn.zoom-active {
            background: #667eea;
            color: white;
        }

        #graph {
            width: 100%;
            min-height: 700px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3c3;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .instructions {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .instructions h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .instructions code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .file-inputs {
                grid-template-columns: 1fr;
            }
            
            .stats-section {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>社交网络图可视化</h1>
            <p>上传节点和边的CSV文件，生成交互式网络图</p>
        </div>

        <div class="upload-section">
            <h2>上传数据文件</h2>
            
            <div id="message"></div>
            
            <div class="file-inputs">
                <div class="file-group">
                    <label for="nodesFile">节点文件 (CSV)</label>
                    <input type="file" id="nodesFile" accept=".csv" required>
                </div>
                <div class="file-group">
                    <label for="edgesFile">边文件 (CSV)</label>
                    <input type="file" id="edgesFile" accept=".csv" required>
                </div>
            </div>

            <button class="btn-submit" id="submitBtn" onclick="uploadFiles()">生成网络图</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在处理数据并生成网络图...</p>
            </div>

            <div class="instructions">
                <h4>CSV文件格式说明</h4>
                <p><strong>节点文件:</strong> 必须包含 <code>id</code> 和 <code>name</code> 列</p>
                <p><strong>边文件:</strong> 必须包含 <code>source</code>, <code>target</code>, <code>weight</code> 列</p>
            </div>
        </div>

        <div class="stats-section hidden" id="statsSection">
            <div class="stat-card">
                <h3 id="statNodes">0</h3>
                <p>节点数量</p>
            </div>
            <div class="stat-card">
                <h3 id="statEdges">0</h3>
                <p>边数量</p>
            </div>
            <div class="stat-card">
                <h3 id="statCommunities">0</h3>
                <p>社区数量</p>
            </div>
            <div class="stat-card">
                <h3 id="statAvgDegree">0</h3>
                <p>平均度数</p>
            </div>
        </div>

        <div class="chart-section hidden" id="chartSection">
            <div class="zoom-controls">
                <span class="zoom-label">缩放控制：</span>
                <button class="zoom-btn" data-scale="0.5" onclick="zoomGraph(0.5, this)">50%</button>
                <button class="zoom-btn" data-scale="0.75" onclick="zoomGraph(0.75, this)">75%</button>
                <button class="zoom-btn zoom-active" data-scale="1" onclick="zoomGraph(1, this)">100%</button>
                <button class="zoom-btn" data-scale="1.25" onclick="zoomGraph(1.25, this)">125%</button>
                <button class="zoom-btn" data-scale="1.5" onclick="zoomGraph(1.5, this)">150%</button>
                <button class="zoom-btn" data-scale="2" onclick="zoomGraph(2, this)">200%</button>
                <button class="zoom-btn" onclick="resetView()">重置视图</button>
            </div>
            <div id="graph"></div>
        </div>
    </div>

    <script>
        var currentGraphData = null;
        var currentScale = 1;

        function showMessage(text, type) {
            var messageDiv = document.getElementById('message');
            var className = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.innerHTML = '<div class="' + className + '">' + text + '</div>';
            setTimeout(function() {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        function uploadFiles() {
            var nodesFile = document.getElementById('nodesFile').files[0];
            var edgesFile = document.getElementById('edgesFile').files[0];

            if (!nodesFile || !edgesFile) {
                showMessage('请选择两个CSV文件', 'error');
                return;
            }

            var formData = new FormData();
            formData.append('nodesFile', nodesFile);
            formData.append('edgesFile', edgesFile);

            var submitBtn = document.getElementById('submitBtn');
            var loading = document.getElementById('loading');
            
            submitBtn.disabled = true;
            loading.style.display = 'block';
            document.getElementById('message').innerHTML = '';

            fetch('/api/upload', {
                method: 'POST',
                body: formData
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    currentGraphData = JSON.parse(data.graph);
                    renderGraph(currentGraphData);
                    updateStats(data.stats);
                    showMessage('网络图生成成功！', 'success');
                    
                    document.getElementById('statsSection').classList.remove('hidden');
                    document.getElementById('chartSection').classList.remove('hidden');
                } else {
                    showMessage(data.error || '生成失败，请检查文件格式', 'error');
                }
            })
            .catch(function(error) {
                showMessage('网络错误: ' + error.message, 'error');
            })
            .finally(function() {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            });
        }

        function renderGraph(graphData) {
            var config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['zoom2d', 'pan2d', 'select2d', 'lasso2d', 'zoomIn2d', 'zoomOut2d', 'autoScale2d', 'resetScale2d']
            };

            Plotly.newPlot('graph', graphData.data, graphData.layout, config);

            var graphDiv = document.getElementById('graph');
            
            graphDiv.on('plotly_hover', function(data) {
                if (data.points.length > 0) {
                    graphDiv.style.cursor = 'pointer';
                }
            });

            graphDiv.on('plotly_unhover', function(data) {
                graphDiv.style.cursor = 'default';
            });
        }

        function zoomGraph(scale, btn) {
            var graphDiv = document.getElementById('graph');
            if (!graphDiv.data) return;

            var xMin = Infinity, xMax = -Infinity;
            var yMin = Infinity, yMax = -Infinity;
            
            for (var i = 0; i < graphDiv.data.length; i++) {
                var trace = graphDiv.data[i];
                if (trace.x) {
                    for (var j = 0; j < trace.x.length; j++) {
                        var x = trace.x[j];
                        var y = trace.y[j];
                        if (x !== null && x !== undefined) {
                            if (x < xMin) xMin = x;
                            if (x > xMax) xMax = x;
                        }
                        if (y !== null && y !== undefined) {
                            if (y < yMin) yMin = y;
                            if (y > yMax) yMax = y;
                        }
                    }
                }
            }
            
            if (xMin === Infinity) return;

            var centerX = (xMin + xMax) / 2;
            var centerY = (yMin + yMax) / 2;
            var rangeX = (xMax - xMin) / scale / 2;
            var rangeY = (yMax - yMin) / scale / 2;

            Plotly.relayout(graphDiv, {
                'xaxis.range': [centerX - rangeX, centerX + rangeX],
                'yaxis.range': [centerY - rangeY, centerY + rangeY]
            });

            var buttons = document.querySelectorAll('.zoom-btn');
            for (var k = 0; k < buttons.length; k++) {
                buttons[k].classList.remove('zoom-active');
            }
            if (btn) {
                btn.classList.add('zoom-active');
            }
            currentScale = scale;
        }

        function resetView() {
            var graphDiv = document.getElementById('graph');
            if (!graphDiv.data) return;

            Plotly.relayout(graphDiv, {
                'xaxis.autorange': true,
                'yaxis.autorange': true
            });

            var buttons = document.querySelectorAll('.zoom-btn');
            for (var k = 0; k < buttons.length; k++) {
                buttons[k].classList.remove('zoom-active');
            }
            
            var defaultBtn = document.querySelector('.zoom-btn:nth-child(4)');
            if (defaultBtn) {
                defaultBtn.classList.add('zoom-active');
            }
            currentScale = 1;
        }

        function updateStats(stats) {
            document.getElementById('statNodes').textContent = stats.num_nodes;
            document.getElementById('statEdges').textContent = stats.num_edges;
            document.getElementById('statCommunities').textContent = stats.num_communities;
            document.getElementById('statAvgDegree').textContent = stats.avg_degree;
        }
    </script>
</body>
</html>
