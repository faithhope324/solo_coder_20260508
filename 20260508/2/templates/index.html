<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波士顿房价预测</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; color: white; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.1rem; opacity: 0.9; }
        .nav { margin-bottom: 20px; }
        .nav a { color: white; text-decoration: none; margin-right: 20px; padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.2); transition: background 0.3s; }
        .nav a:hover { background: rgba(255,255,255,0.3); }
        .nav a.active { background: rgba(255,255,255,0.4); font-weight: bold; }
        .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h2 { color: #333; margin-bottom: 25px; font-size: 1.5rem; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; color: #555; font-weight: 500; font-size: 0.9rem; }
        .form-group input { padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .unit { font-size: 0.8rem; color: #888; margin-top: 4px; }
        .btn-submit { grid-column: span 2; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s; margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); }
        .btn-submit:active { transform: translateY(0); }
        .tips { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 4px solid #667eea; }
        .tips h3 { color: #333; margin-bottom: 10px; font-size: 1rem; }
        .tips p { color: #666; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>波士顿房价预测系统</h1>
            <p class="subtitle">输入房屋特征，使用机器学习模型预测房价</p>
        </header>
        <div class="nav">
            <a href="/" class="active">房价预测</a>
            <a href="/metrics">模型评估</a>
        </div>
        <div class="card">
            <h2>房屋特征输入</h2>
            <form action="/predict" method="POST">
                <div class="form-grid">
                    {% for key, info in feature_info.items() %}
                    <div class="form-group">
                        <label for="{{ key }}">{{ info.label }}</label>
                        <input type="number" step="any" id="{{ key }}" name="{{ key }}" value="{{ info.default }}" required>
                        {% if info.unit %}
                        <span class="unit">单位: {{ info.unit }}</span>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn-submit">预测房价</button>
                </div>
            </form>
        </div>
        <div class="card" style="margin-top: 20px;">
            <div class="tips">
                <h3>使用说明</h3>
                <p>请在上方表单中输入房屋的各项特征参数，然后点击"预测房价"按钮。系统将使用训练好的线性回归模型预测该房屋的价格（单位：美元）。波士顿房价数据集的房价单位为千美元，预测结果会自动转换为美元显示。</p>
            </div>
        </div>
    </div>
</body>
</html>
