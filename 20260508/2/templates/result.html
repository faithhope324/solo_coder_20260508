<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预测结果</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; color: white; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.1rem; opacity: 0.9; }
        .nav { margin-bottom: 20px; }
        .nav a { color: white; text-decoration: none; margin-right: 20px; padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.2); transition: background 0.3s; }
        .nav a:hover { background: rgba(255,255,255,0.3); }
        .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .result-card { text-align: center; }
        .result-label { font-size: 1.2rem; color: #666; margin-bottom: 15px; }
        .prediction-value { font-size: 3.5rem; font-weight: bold; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
        .prediction-unit { font-size: 1.5rem; color: #777; }
        .btn-group { margin-top: 30px; }
        .btn { padding: 12px 30px; border-radius: 25px; font-size: 1rem; font-weight: 500; cursor: pointer; text-decoration: none; margin: 0 10px; transition: transform 0.2s; display: inline-block; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; }
        .btn-secondary { background: transparent; color: #667eea; border: 2px solid #667eea; }
        .btn:hover { transform: translateY(-2px); }
        h2 { color: #333; margin-bottom: 20px; font-size: 1.3rem; }
        .input-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .input-item { display: flex; justify-content: space-between; padding: 10px 15px; background: #f8f9fa; border-radius: 8px; }
        .input-label { color: #666; font-size: 0.9rem; }
        .input-value { font-weight: 500; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>预测结果</h1>
            <p class="subtitle">基于线性回归模型的房价预测</p>
        </header>
        <div class="nav">
            <a href="/">房价预测</a>
            <a href="/metrics">模型评估</a>
        </div>
        <div class="card result-card">
            <p class="result-label">预测房价</p>
            <div class="prediction-value">${{ "{:,.2f}".format(prediction) }}</div>
            <p class="prediction-unit">美元</p>
            <div class="btn-group">
                <a href="/" class="btn btn-primary">重新预测</a>
                <a href="/metrics" class="btn btn-secondary">查看模型评估</a>
            </div>
        </div>
        <div class="card">
            <h2>您输入的特征</h2>
            <div class="input-summary">
                {% for key, info in feature_info.items() %}
                <div class="input-item">
                    <span class="input-label">{{ info.label }}</span>
                    <span class="input-value">{{ input_data[key] }}{% if info.unit %} {{ info.unit }}{% endif %}</span>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
