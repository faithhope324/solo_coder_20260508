<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时聊天室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        .chat-container {
            height: 100vh;
        }

        .user-list {
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            height: 100%;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background-color: #f8f9fa;
        }

        .message-bubble {
            max-width: 75%;
            margin-bottom: 0.75rem;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }

        .message-other {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            margin-right: auto;
        }

        .message-self {
            background-color: #0d6efd;
            color: white;
            margin-left: auto;
        }

        .message-system {
            background-color: #e9ecef;
            color: #6c757d;
            text-align: center;
            max-width: 100%;
            border-radius: 0.5rem;
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
        }

        .message-private {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
        }

        .message-private-self {
            background-color: #d1e7dd;
            border: 1px solid #198754;
            color: #0f5132;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .message-sender {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .user-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }

        .user-item:hover {
            background-color: #e9ecef;
        }

        .user-item.active {
            background-color: #0d6efd;
            color: white;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background-color: #198754;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .private-badge {
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            margin-left: 0.5rem;
        }

        #loginModal .modal-dialog {
            max-width: 400px;
        }

        .sidebar-toggle {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar-toggle {
                display: inline-block;
            }

            .user-list {
                position: absolute;
                left: -100%;
                top: 0;
                bottom: 0;
                width: 75%;
                z-index: 1000;
                background-color: white;
                transition: left 0.3s;
            }

            .user-list.show {
                left: 0;
            }
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #6c757d;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div id="loginModal" class="modal show d-block" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-chat-dots me-2"></i>欢迎来到聊天室</h5>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="nicknameInput" class="form-label">请输入您的昵称</label>
                            <input type="text" class="form-control" id="nicknameInput" placeholder="昵称" maxlength="20" required>
                            <div class="form-text">昵称不能为空，且不能与其他用户重复</div>
                        </div>
                        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i>进入聊天室
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid chat-container d-none" id="chatContainer">
        <div class="row h-100">
            <div class="col-md-3 col-lg-2 p-0 user-list" id="userList">
                <div class="p-3 border-bottom">
                    <h6 class="mb-0">
                        <i class="bi bi-people me-2"></i>在线用户
                        <span class="badge bg-primary" id="userCount">0</span>
                    </h6>
                </div>
                <div id="usersContainer"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-0 chat-area">
                <div class="p-2 border-bottom d-flex align-items-center justify-content-between bg-white">
                    <div class="d-flex align-items-center">
                        <button class="btn btn-outline-secondary btn-sm me-2 sidebar-toggle" id="toggleSidebar">
                            <i class="bi bi-list"></i>
                        </button>
                        <h6 class="mb-0" id="chatTitle">
                            <i class="bi bi-globe me-2"></i>公共聊天室
                        </h6>
                    </div>
                    <div class="d-flex align-items-center">
                        <span class="badge bg-success me-2">
                            <i class="bi bi-person-circle me-1"></i><span id="currentUser"></span>
                        </span>
                        <button class="btn btn-outline-danger btn-sm" id="logoutBtn">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="messages" id="messages"></div>

                <div class="p-3 border-top bg-white">
                    <div class="d-flex gap-2">
                        <div class="flex-grow-1">
                            <select class="form-select mb-2" id="targetSelect">
                                <option value="all">全体成员</option>
                            </select>
                            <div class="input-group">
                                <input type="text" class="form-control" id="messageInput" placeholder="输入消息..." maxlength="500">
                                <button class="btn btn-primary" type="button" id="sendBtn">
                                    <i class="bi bi-send me-1"></i>发送
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentNickname = null;
        let onlineUsers = [];
        let privateTarget = null;
        let connectionTimeout = null;
        let isConnecting = false;

        const loginForm = document.getElementById('loginForm');
        const nicknameInput = document.getElementById('nicknameInput');
        const loginError = document.getElementById('loginError');
        const loginModal = document.getElementById('loginModal');
        const chatContainer = document.getElementById('chatContainer');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const usersContainer = document.getElementById('usersContainer');
        const userCount = document.getElementById('userCount');
        const currentUserSpan = document.getElementById('currentUser');
        const targetSelect = document.getElementById('targetSelect');
        const chatTitle = document.getElementById('chatTitle');
        const toggleSidebar = document.getElementById('toggleSidebar');
        const userList = document.getElementById('userList');
        const logoutBtn = document.getElementById('logoutBtn');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (isConnecting) {
                return;
            }

            const nickname = nicknameInput.value.trim();

            if (!nickname) {
                showLoginError('昵称不能为空');
                return;
            }

            if (nickname.length > 20) {
                showLoginError('昵称长度不能超过20个字符');
                return;
            }

            if (nickname.includes(' ')) {
                showLoginError('昵称不能包含空格');
                return;
            }

            const invalidChars = /[<>"'&\\/]/;
            if (invalidChars.test(nickname)) {
                showLoginError('昵称包含非法字符，请使用正常字符');
                return;
            }

            loginError.classList.add('d-none');
            connectWebSocket(nickname);
        });

        function showLoginError(message) {
            loginError.textContent = message;
            loginError.classList.remove('d-none');
        }

        function connectWebSocket(nickname) {
            isConnecting = true;
            showLoginError('正在连接服务器...');

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);

            connectionTimeout = setTimeout(function() {
                if (ws.readyState !== WebSocket.OPEN) {
                    cleanupConnection();
                    showLoginError('连接服务器超时，请检查网络后重试');
                }
            }, 5000);

            ws.onopen = function() {
                clearTimeout(connectionTimeout);
                ws.send(JSON.stringify({
                    type: 'join',
                    nickname: nickname
                }));
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onerror = function(error) {
                clearTimeout(connectionTimeout);
                cleanupConnection();
                showLoginError('连接服务器失败，请稍后重试');
                console.error('WebSocket error:', error);
            };

            ws.onclose = function() {
                clearTimeout(connectionTimeout);
                if (currentNickname) {
                    showLoginError('与服务器断开连接，请刷新页面重新进入');
                    loginModal.classList.remove('d-none');
                    chatContainer.classList.add('d-none');
                    currentNickname = null;
                    isConnecting = false;
                }
            };
        }

        function cleanupConnection() {
            isConnecting = false;
            if (connectionTimeout) {
                clearTimeout(connectionTimeout);
                connectionTimeout = null;
            }
            if (ws) {
                try {
                    ws.close();
                } catch (e) {}
                ws = null;
            }
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'join_success':
                    isConnecting = false;
                    currentNickname = data.nickname;
                    currentUserSpan.textContent = currentNickname;
                    loginModal.classList.add('d-none');
                    chatContainer.classList.remove('d-none');
                    updateUserList(data.users);
                    addSystemMessage('欢迎进入聊天室！');
                    break;

                case 'error':
                    if (!currentNickname) {
                        cleanupConnection();
                        showLoginError(data.content);
                    } else {
                        addSystemMessage(data.content);
                    }
                    break;

                case 'system':
                    addSystemMessage(data.content);
                    if (data.users) {
                        updateUserList(data.users);
                    }
                    break;

                case 'message':
                    addMessage(data);
                    break;

                case 'private':
                    addPrivateMessage(data);
                    break;

                case 'user_list':
                    updateUserList(data.users);
                    break;
            }
        }

        function updateUserList(users) {
            onlineUsers = users;
            userCount.textContent = users.length;

            usersContainer.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-item d-flex align-items-center';
                if (user === currentNickname) {
                    div.classList.add('active');
                }
                div.innerHTML = `
                    <span class="online-dot"></span>
                    <span>${user}${user === currentNickname ? ' (我)' : ''}</span>
                `;
                div.addEventListener('click', () => {
                    if (user !== currentNickname) {
                        startPrivateChat(user);
                    }
                });
                usersContainer.appendChild(div);
            });

            const currentValue = targetSelect.value;
            targetSelect.innerHTML = '<option value="all">全体成员</option>';
            users.forEach(user => {
                if (user !== currentNickname) {
                    const option = document.createElement('option');
                    option.value = user;
                    option.textContent = user;
                    if (user === currentValue) {
                        option.selected = true;
                    }
                    targetSelect.appendChild(option);
                }
            });
        }

        function startPrivateChat(user) {
            privateTarget = user;
            targetSelect.value = user;
            chatTitle.innerHTML = `<i class="bi bi-lock me-2"></i>与 ${user} 私聊`;
            messageInput.focus();

            if (window.innerWidth <= 768) {
                userList.classList.remove('show');
            }
        }

        targetSelect.addEventListener('change', function() {
            if (this.value === 'all') {
                privateTarget = null;
                chatTitle.innerHTML = `<i class="bi bi-globe me-2"></i>公共聊天室`;
            } else {
                privateTarget = this.value;
                chatTitle.innerHTML = `<i class="bi bi-lock me-2"></i>与 ${this.value} 私聊`;
            }
        });

        function addSystemMessage(content) {
            const div = document.createElement('div');
            div.className = 'message-bubble message-system';
            div.textContent = content;
            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function addMessage(data) {
            const isSelf = data.sender === currentNickname;
            const div = document.createElement('div');
            div.className = `message-bubble ${isSelf ? 'message-self' : 'message-other'}`;

            const time = new Date(data.timestamp).toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            if (isSelf) {
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="message-time">${time}</span>
                    </div>
                    <div>${escapeHtml(data.content)}</div>
                `;
            } else {
                div.innerHTML = `
                    <div class="message-sender">${escapeHtml(data.sender)}</div>
                    <div>${escapeHtml(data.content)}</div>
                    <div class="message-time text-end mt-1">${time}</div>
                `;
            }

            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function addPrivateMessage(data) {
            const isSelf = data.is_sender || data.sender === currentNickname;
            const div = document.createElement('div');
            div.className = `message-bubble ${isSelf ? 'message-private-self' : 'message-private'}`;

            const time = new Date(data.timestamp).toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const partner = isSelf ? data.target : data.sender;

            div.innerHTML = `
                <div class="message-sender d-flex align-items-center">
                    ${isSelf ? '我' : escapeHtml(data.sender)}
                    <span class="badge bg-warning private-badge">私聊</span>
                    <span class="ms-auto">→ ${escapeHtml(partner)}</span>
                </div>
                <div>${escapeHtml(data.content)}</div>
                <div class="message-time text-end mt-1">${time}</div>
            `;

            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !ws) return;

            const target = targetSelect.value;
            if (target === 'all') {
                ws.send(JSON.stringify({
                    type: 'message',
                    content: content
                }));
            } else {
                ws.send(JSON.stringify({
                    type: 'private',
                    content: content,
                    target: target
                }));
            }

            messageInput.value = '';
            messageInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        toggleSidebar.addEventListener('click', function() {
            userList.classList.toggle('show');
        });

        logoutBtn.addEventListener('click', function() {
            if (ws) {
                ws.close();
            }
            currentNickname = null;
            chatContainer.classList.add('d-none');
            loginModal.classList.remove('d-none');
            loginError.classList.add('d-none');
            nicknameInput.value = '';
            nicknameInput.focus();
        });

        nicknameInput.focus();
    </script>
</body>
</html>
