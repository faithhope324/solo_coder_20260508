<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交通流量预测系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🚦 交通流量预测系统</h1>
            <p class="subtitle">基于LSTM的智能交通流量预测</p>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div class="card">
                    <h2>📁 数据上传</h2>
                    <div class="upload-section">
                        <input type="file" id="fileInput" accept=".csv">
                        <label for="fileInput" class="upload-btn">选择CSV文件</label>
                        <p class="file-info">CSV格式: timestamp, intersection_id, traffic_volume</p>
                        <div id="uploadStatus" class="upload-status"></div>
                    </div>
                    <div id="dataInfo" class="data-info" style="display: none;">
                        <h3>数据概览</h3>
                        <p><strong>文件名:</strong> <span id="fileName"></span></p>
                        <p><strong>记录数:</strong> <span id="totalRecords"></span></p>
                        <p><strong>时间范围:</strong> <span id="dateRange"></span></p>
                        <p><strong>路口数量:</strong> <span id="intersectionCount"></span></p>
                    </div>
                </div>

                <div class="card">
                    <h2>🎯 预测设置</h2>
                    <div class="form-group">
                        <label for="intersectionSelect">选择路口:</label>
                        <select id="intersectionSelect" disabled>
                            <option value="">请先上传数据</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="timeSelect">预测时间点:</label>
                        <select id="timeSelect" disabled>
                            <option value="">请先选择路口</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="predictionHours">预测小时数:</label>
                        <input type="number" id="predictionHours" value="1" min="1" max="24" disabled>
                    </div>
                    <button id="predictBtn" class="predict-btn" disabled>开始预测</button>
                </div>

                <div class="card" id="predictionResult" style="display: none;">
                    <h2>📊 预测结果</h2>
                    <div class="result-box">
                        <div class="result-item">
                            <span class="result-label">路口:</span>
                            <span class="result-value" id="resultIntersection"></span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">预测时间:</span>
                            <span class="result-value" id="resultTime"></span>
                        </div>
                        <div class="result-item highlight">
                            <span class="result-label">预测车流量:</span>
                            <span class="result-value" id="resultTraffic"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="card">
                    <h2>📈 历史趋势与预测</h2>
                    <div class="chart-controls">
                        <label for="historyHours">历史数据小时数:</label>
                        <select id="historyHours">
                            <option value="24">最近24小时</option>
                            <option value="72">最近3天</option>
                            <option value="168" selected>最近7天</option>
                            <option value="336">最近14天</option>
                        </select>
                    </div>
                    <div id="chartContainer" class="chart-container"></div>
                </div>

                <div class="card">
                    <h2>🔧 模型信息</h2>
                    <div id="modelInfo" class="model-info">
                        <p class="no-model">请选择路口查看模型信息</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
