<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练曲线 - 模型训练过程</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .chart-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }

        .chart-container {
            position: relative;
            height: 350px;
        }

        .image-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .image-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .image-card img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .model-info {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-top: 25px;
        }

        .model-info h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .info-item .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .loading, .error {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: #666;
            grid-column: 1 / -1;
        }

        .error {
            color: #c62828;
            background: #ffebee;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 模型训练曲线</h1>
            <p>RNN 情感分类模型训练过程可视化</p>
        </div>

        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/curves">训练曲线</a>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>准确率 (Accuracy)</h2>
                <div class="chart-container">
                    <canvas id="accuracyChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>损失 (Loss)</h2>
                <div class="chart-container">
                    <canvas id="lossChart"></canvas>
                </div>
            </div>
        </div>

        <div class="image-card">
            <h2>训练曲线图</h2>
            <img src="/static/training_curves.png" alt="Training Curves" id="curvesImage">
        </div>

        <div class="model-info">
            <h2>模型配置</h2>
            <div class="info-grid">
                <div class="info-item">
                    <div class="label">模型结构</div>
                    <div class="value">Embedding + SimpleRNN</div>
                </div>
                <div class="info-item">
                    <div class="label">词汇表大小</div>
                    <div class="value">10,000</div>
                </div>
                <div class="info-item">
                    <div class="label">最大序列长度</div>
                    <div class="value">200</div>
                </div>
                <div class="info-item">
                    <div class="label">嵌入维度</div>
                    <div class="value">128</div>
                </div>
                <div class="info-item">
                    <div class="label">RNN隐藏单元</div>
                    <div class="value">64</div>
                </div>
                <div class="info-item">
                    <div class="label">训练轮数</div>
                    <div class="value">10 epochs</div>
                </div>
                <div class="info-item">
                    <div class="label">批量大小</div>
                    <div class="value">64</div>
                </div>
                <div class="info-item">
                    <div class="label">优化器</div>
                    <div class="value">Adam (lr=0.001)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        font: {
                            size: 12,
                            weight: 'bold'
                        },
                        padding: 15
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    padding: 12,
                    titleFont: {
                        size: 14
                    },
                    bodyFont: {
                        size: 13
                    }
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Epoch',
                        font: {
                            size: 12,
                            weight: 'bold'
                        }
                    },
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)'
                    }
                },
                y: {
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)'
                    }
                }
            },
            animation: {
                duration: 1500,
                easing: 'easeOutQuart'
            }
        };

        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                    return;
                }

                const epochs = data.accuracy.map((_, i) => i + 1);

                new Chart(document.getElementById('accuracyChart'), {
                    type: 'line',
                    data: {
                        labels: epochs,
                        datasets: [
                            {
                                label: '训练集',
                                data: data.accuracy,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#667eea',
                                pointBorderColor: 'white',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                pointHoverRadius: 7
                            },
                            {
                                label: '验证集',
                                data: data.val_accuracy,
                                borderColor: '#f093fb',
                                backgroundColor: 'rgba(240, 147, 251, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#f093fb',
                                pointBorderColor: 'white',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                pointHoverRadius: 7
                            }
                        ]
                    },
                    options: {
                        ...chartOptions,
                        scales: {
                            ...chartOptions.scales,
                            y: {
                                ...chartOptions.scales.y,
                                title: {
                                    display: true,
                                    text: 'Accuracy',
                                    font: {
                                        size: 12,
                                        weight: 'bold'
                                    }
                                },
                                min: 0,
                                max: 1
                            }
                        }
                    }
                });

                new Chart(document.getElementById('lossChart'), {
                    type: 'line',
                    data: {
                        labels: epochs,
                        datasets: [
                            {
                                label: '训练集',
                                data: data.loss,
                                borderColor: '#ff6b6b',
                                backgroundColor: 'rgba(255, 107, 107, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#ff6b6b',
                                pointBorderColor: 'white',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                pointHoverRadius: 7
                            },
                            {
                                label: '验证集',
                                data: data.val_loss,
                                borderColor: '#4ecdc4',
                                backgroundColor: 'rgba(78, 205, 196, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#4ecdc4',
                                pointBorderColor: 'white',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                pointHoverRadius: 7
                            }
                        ]
                    },
                    options: {
                        ...chartOptions,
                        scales: {
                            ...chartOptions.scales,
                            y: {
                                ...chartOptions.scales.y,
                                title: {
                                    display: true,
                                    text: 'Loss',
                                    font: {
                                        size: 12,
                                        weight: 'bold'
                                    }
                                }
                            }
                        }
                    }
                });
            })
            .catch(err => {
                showError('无法加载训练历史数据: ' + err.message);
            });

        function showError(message) {
            document.querySelector('.charts-grid').innerHTML = `
                <div class="error">
                    <h3>❌ ${message}</h3>
                    <p style="margin-top: 10px;">请先运行 <code>python train.py</code> 训练模型</p>
                </div>
            `;
            document.querySelector('.image-card').style.display = 'none';
        }
    </script>
</body>
</html>
