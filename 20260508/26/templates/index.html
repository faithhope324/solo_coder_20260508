<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情感分析 - RNN 文本分类</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 650px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 25px;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            padding: 8px 16px;
            border-radius: 20px;
            background: #f0f0ff;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: #667eea;
            color: white;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .analyze-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            background: #f0f0f0;
            color: #666;
            flex: 0 0 auto;
            width: 100px;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.positive {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .result.negative {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        .sentiment-label {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .positive .sentiment-label {
            color: #1a7a4a;
        }

        .negative .sentiment-label {
            color: #b03a2e;
        }

        .confidence-bar {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .confidence-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s ease;
        }

        .positive .confidence-fill {
            background: linear-gradient(90deg, #1a7a4a, #27ae60);
        }

        .negative .confidence-fill {
            background: linear-gradient(90deg, #b03a2e, #e74c3c);
        }

        .confidence-text {
            font-size: 14px;
            color: #333;
            text-align: right;
            margin-top: 5px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            display: none;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .model-warning {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 文本情感分析</h1>
        <p class="subtitle">基于循环神经网络（RNN）的IMDB评论情感分类</p>
        
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/curves">训练曲线</a>
        </div>

        {% if not model_exists %}
        <div class="model-warning">
            ⚠️ 模型尚未训练，请先运行 <code>python train.py</code> 训练模型
        </div>
        {% endif %}

        <textarea id="inputText" placeholder="请输入一句中文或英文评论，例如：这部电影真的很棒！ / This movie is absolutely fantastic!"></textarea>
        
        <div class="button-group">
            <button class="analyze-btn" id="analyzeBtn" onclick="analyzeSentiment()">分析情感</button>
            <button class="clear-btn" onclick="clearInput()">清空</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            分析中...
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="sentiment-label" id="sentimentLabel"></div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill"></div>
            </div>
            <div class="confidence-text" id="confidenceText"></div>
        </div>
    </div>

    <script>
        async function analyzeSentiment() {
            const text = document.getElementById('inputText').value.trim();
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const btn = document.getElementById('analyzeBtn');

            if (!text) {
                showError('请输入要分析的文本');
                return;
            }

            btn.disabled = true;
            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (response.ok) {
                    const isPositive = data.sentiment === '正面';
                    
                    resultDiv.className = 'result ' + (isPositive ? 'positive' : 'negative');
                    document.getElementById('sentimentLabel').textContent = 
                        (isPositive ? '😊 正面情感' : '😢 负面情感');
                    document.getElementById('confidenceFill').style.width = '0%';
                    document.getElementById('confidenceText').textContent = 
                        `置信度: ${data.confidence}%`;
                    
                    resultDiv.style.display = 'block';
                    
                    setTimeout(() => {
                        document.getElementById('confidenceFill').style.width = data.confidence + '%';
                    }, 50);
                } else {
                    showError(data.error || '分析失败');
                }
            } catch (err) {
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }

        function clearInput() {
            document.getElementById('inputText').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('inputText').focus();
        }

        document.getElementById('inputText').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeSentiment();
            }
        });
    </script>
</body>
</html>
