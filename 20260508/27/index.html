<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 限流监控仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .status-bar {
            background: white;
            border-radius: 10px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1f2937;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .table-container h2 {
            margin-bottom: 20px;
            color: #1f2937;
            font-size: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f3f4f6;
        }

        th {
            padding: 15px;
            text-align: left;
            color: #374151;
            font-weight: 600;
            border-bottom: 2px solid #e5e7eb;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f3f4f6;
        }

        tr:hover {
            background: #f9fafb;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-fill.low { background: #10b981; }
        .progress-fill.medium { background: #f59e0b; }
        .progress-fill.high { background: #ef4444; }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-normal {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .test-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .test-section h2 {
            margin-bottom: 15px;
            color: #1f2937;
        }

        .test-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-right: 10px;
        }

        .test-button:hover {
            background: #5a6fd8;
        }

        .test-result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            display: none;
        }

        .test-result.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .test-result.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .last-update {
            font-size: 0.85rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚦 API 限流监控仪表板</h1>
            <p>每个客户端 IP 每分钟最多 10 次请求</p>
        </header>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator" id="connectionStatus"></div>
                <span id="connectionText">实时连接中</span>
            </div>
            <div class="last-update">
                最后更新: <span id="lastUpdate">--</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>活跃 IP 数</h3>
                <div class="value" id="totalIps">0</div>
            </div>
            <div class="stat-card">
                <h3>总请求数</h3>
                <div class="value" id="totalRequests">0</div>
            </div>
            <div class="stat-card">
                <h3>限流触发次数</h3>
                <div class="value" id="blockedRequests">0</div>
            </div>
        </div>

        <div class="table-container">
            <h2>📊 IP 请求统计 (最近一分钟)</h2>
            <table>
                <thead>
                    <tr>
                        <th>IP 地址</th>
                        <th>请求次数</th>
                        <th>使用进度</th>
                        <th>剩余次数</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="statsBody">
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                </svg>
                                <p>暂无数据，开始发送请求以查看统计信息</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="test-section">
            <h2>🧪 测试限流功能</h2>
            <p style="color: #6b7280; margin-bottom: 15px;">点击下方按钮发送测试请求，观察限流效果</p>
            <button class="test-button" onclick="sendTestRequest()">发送测试请求</button>
            <button class="test-button" onclick="sendMultipleRequests(5)">发送 5 次请求</button>
            <button class="test-button" onclick="sendMultipleRequests(15)">发送 15 次请求</button>
            <div class="test-result" id="testResult"></div>
        </div>
    </div>

    <script>
        let eventSource;
        let blockedCount = 0;

        function connectSSE() {
            eventSource = new EventSource('/stream');

            eventSource.onopen = () => {
                document.getElementById('connectionStatus').classList.remove('disconnected');
                document.getElementById('connectionText').textContent = '实时连接中';
            };

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateStats(data.stats);
                    updateLastUpdate(data.timestamp);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };

            eventSource.onerror = () => {
                document.getElementById('connectionStatus').classList.add('disconnected');
                document.getElementById('connectionText').textContent = '连接断开，正在重连...';
            };
        }

        function updateStats(stats) {
            const tbody = document.getElementById('statsBody');
            const totalIps = stats.length;
            const totalRequests = stats.reduce((sum, s) => sum + s.count, 0);

            document.getElementById('totalIps').textContent = totalIps;
            document.getElementById('totalRequests').textContent = totalRequests;
            document.getElementById('blockedRequests').textContent = blockedCount;

            if (stats.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                </svg>
                                <p>暂无数据，开始发送请求以查看统计信息</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = stats.map(stat => {
                const percentage = (stat.count / stat.limit) * 100;
                let progressClass = 'low';
                let badgeClass = 'badge-normal';
                let badgeText = '正常';

                if (percentage >= 80) {
                    progressClass = 'high';
                    badgeClass = 'badge-danger';
                    badgeText = '即将超限';
                } else if (percentage >= 50) {
                    progressClass = 'medium';
                    badgeClass = 'badge-warning';
                    badgeText = '注意';
                }

                if (stat.count >= stat.limit) {
                    badgeText = '已限流';
                }

                return `
                    <tr>
                        <td><code>${stat.ip}</code></td>
                        <td><strong>${stat.count}</strong> / ${stat.limit}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill ${progressClass}" style="width: ${Math.min(percentage, 100)}%"></div>
                            </div>
                        </td>
                        <td><strong>${stat.remaining}</strong></td>
                        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    </tr>
                `;
            }).join('');
        }

        function updateLastUpdate(timestamp) {
            const date = new Date(timestamp * 1000);
            document.getElementById('lastUpdate').textContent = date.toLocaleTimeString();
        }

        async function sendTestRequest() {
            const resultDiv = document.getElementById('testResult');
            try {
                const response = await fetch('/api/test');
                const data = await response.json();
                if (response.status === 429) {
                    blockedCount++;
                    resultDiv.className = 'test-result error';
                    resultDiv.textContent = `❌ 429 Too Many Requests - 请求已被限流`;
                } else {
                    resultDiv.className = 'test-result success';
                    resultDiv.textContent = `✅ 200 OK - ${data.message} | 剩余次数: ${response.headers.get('X-RateLimit-Remaining')}`;
                }
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = `❌ 错误: ${error.message}`;
            }
        }

        async function sendMultipleRequests(count) {
            for (let i = 0; i < count; i++) {
                await sendTestRequest();
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }

        connectSSE();
    </script>
</body>
</html>
