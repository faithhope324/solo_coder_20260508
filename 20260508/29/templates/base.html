<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RSS Reader{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="container">
        <nav class="navbar">
            <div class="nav-brand">
                <a href="{{ url_for('main.index') }}" class="brand">RSS Reader</a>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('main.index') }}" class="nav-link">Home</a>
                <a href="{{ url_for('admin.admin') }}" class="nav-link">Manage Feeds</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 RSS Reader</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
