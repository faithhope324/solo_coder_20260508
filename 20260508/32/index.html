<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 水面波纹模拟</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1628;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    .info h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .info p {
      opacity: 0.7;
      font-size: 12px;
    }
    .fps {
      position: absolute;
      top: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-family: 'Courier New', monospace;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" id="loading">加载中...</div>
    <div class="info">
      <h1>3D 水面波纹</h1>
      <p>点击水面产生涟漪</p>
    </div>
    <div class="fps" id="fps">FPS: --</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
