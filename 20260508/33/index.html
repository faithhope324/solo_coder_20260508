<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十字路口交通控制游戏</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <div class="info-panel">
      <div class="info-item">
        <span class="label">得分</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="info-item">
        <span class="label">时间</span>
        <span id="timer" class="value">60</span>
      </div>
      <div class="info-item">
        <span class="label">状态</span>
        <span id="status" class="value">准备中</span>
      </div>
    </div>

    <div class="game-area">
      <canvas id="gameCanvas" width="600" height="600"></canvas>
      
      <div class="traffic-light north" data-direction="north">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
      <div class="traffic-light south" data-direction="south">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
      <div class="traffic-light east" data-direction="east">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
      <div class="traffic-light west" data-direction="west">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>

      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <h1 id="overlayTitle">十字路口交通控制</h1>
          <p id="overlayMessage">点击红绿灯切换信号，让车辆安全通过！</p>
          <button id="startBtn" class="btn">开始游戏</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="restartBtn" class="btn secondary" disabled>重新开始</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
