<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV 快速透视图工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
    <div class="container mx-auto px-4 py-8 max-w-[1600px]">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-800 mb-2" style="font-family: 'Space Grotesk', sans-serif;">
                📊 CSV 快速透视图工具
            </h1>
            <p class="text-slate-600 text-lg">上传 CSV 文件，拖拽字段，快速生成数据透视表和图表</p>
        </header>

        <!-- File Upload Section -->
        <section id="upload-section" class="mb-8">
            <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center bg-white/70 backdrop-blur-sm hover:border-blue-500 hover:bg-blue-50/50 transition-all duration-300 cursor-pointer shadow-lg">
                <div class="text-6xl mb-4">📁</div>
                <h3 class="text-xl font-semibold text-slate-700 mb-2">拖拽 CSV 文件到这里</h3>
                <p class="text-slate-500 mb-4">或点击选择文件</p>
                <input type="file" id="file-input" accept=".csv" class="hidden">
                <button id="browse-btn" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-3 rounded-xl font-medium hover:from-blue-700 hover:to-indigo-700 transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                    选择文件
                </button>
            </div>
            <div id="file-info" class="hidden mt-4 p-4 bg-white rounded-xl shadow-md">
                <span id="file-name" class="text-slate-700 font-medium"></span>
                <button id="remove-file" class="ml-4 text-red-500 hover:text-red-700 text-sm">✕ 移除</button>
            </div>
        </section>

        <!-- Main Content - Hidden initially -->
        <div id="main-content" class="hidden">
            <!-- Data Preview -->
            <section class="mb-8 bg-white rounded-2xl shadow-lg p-6">
                <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center gap-2">
                    <span>📋</span> 数据预览
                </h2>
                <div id="data-preview" class="overflow-x-auto max-h-64 overflow-y-auto border border-slate-200 rounded-lg">
                    <table class="min-w-full text-sm">
                        <thead id="preview-header" class="bg-slate-100 sticky top-0"></thead>
                        <tbody id="preview-body"></tbody>
                    </table>
                </div>
                <p id="data-stats" class="mt-3 text-slate-500 text-sm"></p>
            </section>

            <!-- Pivot Configuration -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
                <!-- Field List -->
                <section class="bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                        <span>🏷️</span> 字段列表
                    </h2>
                    <div id="field-list" class="space-y-2 max-h-80 overflow-y-auto">
                    </div>
                </section>

                <!-- Drop Zones -->
                <section class="lg:col-span-3 bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                        <span>🎯</span> 透视配置
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Rows Zone -->
                        <div class="drop-zone-container">
                            <div class="text-sm font-medium text-slate-600 mb-2 flex items-center gap-1">
                                <span>📏</span> 行 (Rows)
                            </div>
                            <div id="rows-zone" class="drop-zone min-h-32 p-4 border-2 border-dashed border-amber-300 bg-amber-50/50 rounded-xl" data-zone="rows">
                                <p class="text-amber-400 text-sm text-center">拖拽字段到这里</p>
                            </div>
                        </div>

                        <!-- Columns Zone -->
                        <div class="drop-zone-container">
                            <div class="text-sm font-medium text-slate-600 mb-2 flex items-center gap-1">
                                <span>📐</span> 列 (Columns)
                            </div>
                            <div id="columns-zone" class="drop-zone min-h-32 p-4 border-2 border-dashed border-emerald-300 bg-emerald-50/50 rounded-xl" data-zone="columns">
                                <p class="text-emerald-400 text-sm text-center">拖拽字段到这里</p>
                            </div>
                        </div>

                        <!-- Values Zone -->
                        <div class="drop-zone-container">
                            <div class="text-sm font-medium text-slate-600 mb-2 flex items-center gap-1">
                                <span>🔢</span> 值 (Values)
                            </div>
                            <div id="values-zone" class="drop-zone min-h-32 p-4 border-2 border-dashed border-blue-300 bg-blue-50/50 rounded-xl" data-zone="values">
                                <p class="text-blue-400 text-sm text-center">拖拽字段到这里</p>
                            </div>
                        </div>
                    </div>

                    <!-- Aggregation Options -->
                    <div id="aggregation-options" class="mt-6 hidden">
                        <div class="flex flex-wrap gap-4 items-center">
                            <label class="text-sm font-medium text-slate-600">聚合方式：</label>
                            <div class="flex gap-2">
                                <button class="agg-btn active px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white" data-agg="sum">求和</button>
                                <button class="agg-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300" data-agg="count">计数</button>
                                <button class="agg-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300" data-agg="average">平均值</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Chart Type Toggle -->
            <section class="mb-6">
                <div class="bg-white rounded-2xl shadow-lg p-4 inline-flex gap-2">
                    <button id="table-view-btn" class="chart-type-btn active px-6 py-2 rounded-xl font-medium bg-blue-600 text-white transition-all">
                        📋 表格视图
                    </button>
                    <button id="chart-view-btn" class="chart-type-btn px-6 py-2 rounded-xl font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 transition-all">
                        📊 柱状图视图
                    </button>
                </div>
            </section>

            <!-- Pivot Result -->
            <section id="pivot-result-section" class="bg-white rounded-2xl shadow-lg p-6 min-h-96">
                <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center gap-2">
                    <span>📈</span> 透视结果
                </h2>
                <div id="empty-state" class="text-center py-16">
                    <div class="text-6xl mb-4">🎯</div>
                    <p class="text-slate-500 text-lg">拖拽字段到上方区域开始分析</p>
                </div>
                <div id="table-container" class="hidden overflow-x-auto">
                    <table id="pivot-table" class="min-w-full border-collapse">
                    </table>
                </div>
                <div id="chart-container" class="hidden h-96">
                    <canvas id="pivot-chart"></canvas>
                </div>
            </section>
        </div>
    </div>

    <script src="js/csvParser.js"></script>
    <script src="js/aggregator.js"></script>
    <script src="js/dragDrop.js"></script>
    <script src="js/chartRenderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
