<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片精灵表生成器 - Sprite Sheet Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>图片精灵表生成器</h1>
            <p class="subtitle">上传多张图片，自动排列生成精灵表并输出 CSS 代码</p>
        </header>

        <div class="main-content">
            <div class="panel left-panel">
                <div class="panel-section">
                    <h2>1. 上传图片</h2>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="fileInput" multiple accept="image/*">
                        <div class="upload-content">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>点击或拖拽图片到此处上传</p>
                            <p class="hint">支持 JPG、PNG、GIF、WebP 等格式</p>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <div class="section-header">
                        <h2>2. 图片列表</h2>
                        <button id="clearBtn" class="btn-clear" style="display: none;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                            清空
                        </button>
                    </div>
                    <div class="image-list" id="imageList">
                        <p class="empty-tip">暂无图片，请上传</p>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>3. 布局设置</h2>
                    <div class="settings-grid">
                        <div class="setting-item">
                            <label for="columns">每行列数</label>
                            <input type="number" id="columns" value="4" min="1" max="20">
                        </div>
                        <div class="setting-item">
                            <label for="padding">图片间距 (px)</label>
                            <input type="number" id="padding" value="10" min="0" max="100">
                        </div>
                        <div class="setting-item">
                            <label for="bgColor">背景颜色</label>
                            <input type="color" id="bgColor" value="#ffffff">
                        </div>
                        <div class="setting-item">
                            <label for="classPrefix">CSS 类前缀</label>
                            <input type="text" id="classPrefix" value="sprite">
                        </div>
                    </div>
                    <button id="generateBtn" class="btn-primary">生成精灵表</button>
                </div>
            </div>

            <div class="panel right-panel">
                <div class="panel-section">
                    <h2>4. 预览</h2>
                    <div class="preview-container" id="previewContainer">
                        <canvas id="canvas"></canvas>
                        <div class="preview-empty" id="previewEmpty">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <p>精灵表预览区域</p>
                        </div>
                        <div class="progress-overlay" id="progressOverlay" style="display: none;">
                            <div class="progress-content">
                                <div class="spinner"></div>
                                <p id="progressText">处理中...</p>
                                <div class="progress-bar">
                                    <div class="progress-bar-fill" id="progressBarFill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="action-buttons" id="actionButtons" style="display: none;">
                        <button id="downloadBtn" class="btn-secondary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            下载 PNG
                        </button>
                        <button id="copyCssBtn" class="btn-secondary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制 CSS
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>5. CSS 代码</h2>
                    <div class="code-container">
                        <pre><code id="cssOutput">/* CSS 代码将在这里生成 */</code></pre>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>6. 使用说明</h2>
                    <div class="instructions">
                        <ol>
                            <li>上传多张图片作为精灵帧</li>
                            <li>拖拽调整图片顺序，或点击删除按钮移除图片</li>
                            <li>设置每行显示的列数和图片间距</li>
                            <li>点击"生成精灵表"按钮</li>
                            <li>下载合并后的 PNG 图片</li>
                            <li>复制 CSS 代码到你的项目中使用</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
