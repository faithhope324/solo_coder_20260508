<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D房间漫游</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Microsoft YaHei', sans-serif;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      opacity: 0.8;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
    }

    #crosshair::before {
      width: 2px;
      height: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      width: 20px;
      height: 2px;
      top: 50%;
      transform: translateY(-50%);
    }

    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 20;
      transition: opacity 0.3s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-screen h1 {
      color: #fff;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.8);
    }

    #start-screen p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 40px;
    }

    #start-btn {
      padding: 15px 50px;
      font-size: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(102, 126, 234, 0.6);
    }

    #controls-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.8;
    }

    #controls-info h3 {
      margin-bottom: 10px;
      color: #667eea;
    }

    #position-info {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="canvas-container"></div>
    <div id="ui-overlay">
      <div id="crosshair"></div>
      <div id="controls-info">
        <h3>操作说明</h3>
        <p>W / ↑ - 前进</p>
        <p>S / ↓ - 后退</p>
        <p>A / ← - 左移</p>
        <p>D / → - 右移</p>
        <p>鼠标 - 环顾四周</p>
        <p>ESC - 退出鼠标锁定</p>
      </div>
      <div id="position-info">
        <div>位置: <span id="pos">0.00, 1.70, 0.00</span></div>
        <div>朝向: <span id="rot">0.00°</span></div>
      </div>
    </div>
    <div id="start-screen">
      <h1>🏠 3D 房间漫游</h1>
      <p>点击下方按钮开始体验第一人称视角漫游</p>
      <button id="start-btn">开始漫游</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
