<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏玩家流失预测系统</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>游戏玩家流失预测系统</h1>
            <p class="subtitle">基于随机森林模型的智能流失预警与干预平台</p>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">总玩家数</div>
                <div class="stat-value" id="totalPlayers">0</div>
            </div>
            <div class="stat-card high-risk">
                <div class="stat-label">高风险玩家</div>
                <div class="stat-value" id="highRiskCount">0</div>
                <div class="stat-percent" id="highRiskPercent">0%</div>
            </div>
            <div class="stat-card medium-risk">
                <div class="stat-label">中风险玩家</div>
                <div class="stat-value" id="mediumRiskCount">0</div>
                <div class="stat-percent" id="mediumRiskPercent">0%</div>
            </div>
            <div class="stat-card low-risk">
                <div class="stat-label">低风险玩家</div>
                <div class="stat-value" id="lowRiskCount">0</div>
                <div class="stat-percent" id="lowRiskPercent">0%</div>
            </div>
        </div>

        <div class="main-content">
            <div class="player-list-section">
                <div class="section-header">
                    <h2>玩家风险列表</h2>
                    <div class="header-actions">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="搜索玩家ID或姓名...">
                            <button class="search-clear" id="searchClear" style="display: none;">&times;</button>
                        </div>
                        <div class="filter-group">
                            <button class="filter-btn active" data-filter="all">全部</button>
                            <button class="filter-btn high" data-filter="high">高风险</button>
                            <button class="filter-btn medium" data-filter="medium">中风险</button>
                            <button class="filter-btn low" data-filter="low">低风险</button>
                        </div>
                        <button class="btn-primary" id="batchInterveneBtn" disabled>
                            批量干预 (<span id="selectedCount">0</span>)
                        </button>
                    </div>
                </div>

                <div class="table-container">
                    <table class="player-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">
                                    <input type="checkbox" id="selectAll">
                                </th>
                                <th style="width: 90px;">玩家ID</th>
                                <th style="width: 70px;">姓名</th>
                                <th style="width: 140px;">流失概率</th>
                                <th style="width: 80px;">风险等级</th>
                                <th style="width: 80px; white-space: nowrap;">7日登录</th>
                                <th style="width: 90px;">累计充值</th>
                                <th style="width: 80px;">关卡进度</th>
                                <th style="width: 100px; white-space: nowrap;">距上次登录</th>
                                <th style="width: 70px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="playerTableBody">
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="pagination">
                </div>
            </div>

            <div class="detail-section" id="detailSection">
                <div class="detail-placeholder" id="detailPlaceholder">
                    <div class="placeholder-icon">👤</div>
                    <p>选择一个玩家查看详细信息</p>
                </div>

                <div class="detail-content" id="detailContent" style="display: none;">
                    <div class="detail-header">
                        <div class="player-info">
                            <h3 id="detailName">玩家姓名</h3>
                            <span class="player-id" id="detailPlayerId">P00001</span>
                        </div>
                        <div class="risk-badge" id="detailRiskBadge">高风险</div>
                    </div>

                    <div class="probability-section">
                        <div class="probability-circle" id="probabilityCircle">
                            <svg viewBox="0 0 120 120">
                                <circle cx="60" cy="60" r="54" fill="none" stroke="#e6e6e6" stroke-width="8"/>
                                <circle id="progressCircle" cx="60" cy="60" r="54" fill="none" 
                                        stroke="#ff4757" stroke-width="8" stroke-linecap="round"
                                        stroke-dasharray="339.292" stroke-dashoffset="339.292"
                                        transform="rotate(-90 60 60)"/>
                            </svg>
                            <div class="probability-text">
                                <span id="probabilityValue">0%</span>
                                <small>流失概率</small>
                            </div>
                        </div>
                    </div>

                    <div class="radar-section">
                        <h4>行为特征雷达图</h4>
                        <div class="radar-container">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>

                    <div class="features-section">
                        <h4>详细特征</h4>
                        <div class="features-grid" id="featuresGrid">
                        </div>
                    </div>

                    <div class="recommendations-section">
                        <h4>运营建议</h4>
                        <div class="recommendations-list" id="recommendationsList">
                        </div>
                    </div>

                    <div class="detail-intervention-section">
                        <h4>运营干预</h4>
                        <div class="single-intervention-options">
                            <label>
                                <input type="radio" name="singleInterventionType" value="auto" checked>
                                <span>智能匹配（推荐）</span>
                            </label>
                            <label>
                                <input type="radio" name="singleInterventionType" value="push">
                                <span>推送召回消息</span>
                            </label>
                            <label>
                                <input type="radio" name="singleInterventionType" value="coupon">
                                <span>发送优惠券</span>
                            </label>
                            <label>
                                <input type="radio" name="singleInterventionType" value="event">
                                <span>活动邀请</span>
                            </label>
                            <label>
                                <input type="radio" name="singleInterventionType" value="guide">
                                <span>新手引导</span>
                            </label>
                        </div>
                        <div class="detail-actions">
                            <button class="btn-primary" id="singleInterveneBtn">执行干预</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="interveneModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>批量干预</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <p>已选择 <strong id="modalPlayerCount">0</strong> 名玩家进行干预</p>
                <div class="intervention-options">
                    <label>
                        <input type="radio" name="interventionType" value="auto" checked>
                        <span>智能匹配（推荐）</span>
                    </label>
                    <label>
                        <input type="radio" name="interventionType" value="push">
                        <span>推送召回消息</span>
                    </label>
                    <label>
                        <input type="radio" name="interventionType" value="coupon">
                        <span>发送优惠券</span>
                    </label>
                    <label>
                        <input type="radio" name="interventionType" value="event">
                        <span>活动邀请</span>
                    </label>
                    <label>
                        <input type="radio" name="interventionType" value="guide">
                        <span>新手引导</span>
                    </label>
                </div>
                <div class="selected-preview" id="selectedPreview">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelIntervene">取消</button>
                <button class="btn-primary" id="confirmIntervene">确认执行</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" style="display: none;"></div>

    <script src="app.js"></script>
</body>
</html>
