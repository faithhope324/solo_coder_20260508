<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像超分辨率批处理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>图像超分辨率批处理系统</h1>
            <p class="subtitle">基于 ESRGAN / SwinIR 模型，支持 2x / 4x 放大</p>
            <div class="queue-status">
                <span class="status-item">
                    <span class="status-dot processing"></span>
                    处理中: <strong id="processing-count">0</strong>
                </span>
                <span class="status-item">
                    <span class="status-dot queued"></span>
                    排队中: <strong id="queued-count">0</strong>
                </span>
                <span class="status-item">
                    <span class="status-dot completed"></span>
                    已完成: <strong id="completed-count">0</strong>
                </span>
            </div>
        </header>

        <section class="upload-section">
            <div class="upload-controls">
                <div class="control-group">
                    <label for="model-select">模型选择:</label>
                    <select id="model-select">
                        <option value="esrgan">ESRGAN (速度快)</option>
                        <option value="swinir">SwinIR (质量优)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="scale-select">放大倍数:</label>
                    <select id="scale-select">
                        <option value="2">2x</option>
                        <option value="4" selected>4x</option>
                    </select>
                </div>
                <button id="clear-completed" class="btn btn-secondary">
                    清除已完成
                </button>
            </div>

            <div class="upload-area" id="upload-area">
                <input type="file" id="file-input" multiple accept="image/*" hidden>
                <div class="upload-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p class="upload-text">点击或拖拽图片到此处上传</p>
                    <p class="upload-hint">支持 JPG, PNG, BMP, WebP 格式，可多选</p>
                </div>
            </div>

            <div class="batch-actions" id="batch-actions" style="display: none;">
                <button id="download-selected" class="btn btn-primary">
                    下载选中图片 (ZIP)
                </button>
                <span class="selected-count">
                    已选择 <strong id="selected-count">0</strong> 张图片
                </span>
            </div>
        </section>

        <section class="tasks-section">
            <div class="tasks-header">
                <h2>任务列表</h2>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        网格
                    </button>
                    <button class="view-btn" data-view="list">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        列表
                    </button>
                </div>
            </div>

            <div id="tasks-container" class="tasks-grid">
                <div class="empty-state" id="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <p>暂无任务，上传图片开始处理</p>
                </div>
            </div>
        </section>

        <div class="modal" id="compare-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">前后对比</h3>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="compare-container" id="compare-container">
                        <div class="compare-images">
                            <img class="compare-img compare-before" id="compare-before" alt="原图">
                            <img class="compare-img compare-after" id="compare-after" alt="超分结果">
                            <div class="compare-slider" id="compare-slider">
                                <div class="compare-handle">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"></polyline>
                                        <polyline points="9 18 3 12 9 6"></polyline>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-info" id="modal-info"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
