<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth2 回调</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #67c23a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: white;
      font-size: 32px;
    }
    .icon.error {
      background: #f56c6c;
    }
    h1 {
      color: #303133;
      margin: 0 0 10px 0;
      font-size: 20px;
    }
    p {
      color: #606266;
      margin: 0;
      font-size: 14px;
    }
    .code-box {
      margin-top: 20px;
      padding: 16px;
      background: #f5f7fa;
      border-radius: 8px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
      color: #606266;
      word-break: break-all;
      text-align: left;
    }
    .loading {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid #e4e7ed;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="loading"></div>
    <p style="margin-top: 20px;">正在处理授权...</p>
  </div>

  <script>
    function getQueryParams() {
      const params = {};
      const search = window.location.search.substring(1);
      if (search) {
        const pairs = search.split('&');
        for (const pair of pairs) {
          const [key, value] = pair.split('=');
          params[decodeURIComponent(key)] = decodeURIComponent(value || '');
        }
      }
      return params;
    }

    function sendCallbackMessage(data) {
      if (window.opener) {
        window.opener.postMessage({
          type: 'oauth2_callback',
          ...data
        }, '*');
      }
    }

    function showSuccess(code) {
      const container = document.getElementById('container');
      container.innerHTML = `
        <div class="icon">✓</div>
        <h1>授权成功</h1>
        <p>已获取授权码，正在返回应用...</p>
        <div class="code-box">code: ${code}</div>
      `;
    }

    function showError(error) {
      const container = document.getElementById('container');
      container.innerHTML = `
        <div class="icon error">✕</div>
        <h1>授权失败</h1>
        <p>${error}</p>
      `;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const params = getQueryParams();

      if (params.code) {
        showSuccess(params.code);
        sendCallbackMessage({ code: params.code });
      } else if (params.error) {
        showError(params.error);
        sendCallbackMessage({ error: params.error });
      } else {
        showError('未知错误');
        sendCallbackMessage({ error: 'unknown_error' });
      }
    });
  </script>
</body>
</html>
