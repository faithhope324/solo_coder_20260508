<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷统计结果</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-gray-600">加载统计数据中...</p>
        </div>

        <div id="resultsContainer" class="hidden">
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 id="surveyTitle" class="text-2xl font-bold text-gray-800 mb-2"></h1>
                        <p id="surveyDescription" class="text-gray-600 mb-4"></p>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-bold text-blue-600" id="totalResponses">0</div>
                        <div class="text-sm text-gray-500">总答卷数</div>
                    </div>
                </div>
                
                <div class="flex gap-4 mt-4 pt-4 border-t">
                    <button onclick="exportCSV()" 
                        class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition flex items-center gap-2">
                        📥 导出 CSV
                    </button>
                    <button onclick="copyShareLink()" 
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition flex items-center gap-2">
                        🔗 复制问卷链接
                    </button>
                    <button onclick="window.location.href='/create-survey'" 
                        class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg transition flex items-center gap-2">
                        ➕ 创建新问卷
                    </button>
                </div>

                <div id="liveIndicator" class="mt-4 flex items-center gap-2 text-green-600">
                    <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-sm">实时更新中 - 通过 WebSocket 连接</span>
                </div>
            </div>

            <div id="chartsContainer" class="space-y-6"></div>
        </div>

        <div id="errorMessage" class="hidden">
            <div class="bg-white rounded-lg shadow-lg p-8 text-center">
                <div class="text-6xl mb-4">❌</div>
                <h2 class="text-2xl font-bold text-red-600 mb-4">出错了</h2>
                <p id="errorText" class="text-gray-600"></p>
            </div>
        </div>
    </div>

    <script>
        const surveyId = window.location.pathname.split('/')[2];
        let charts = {};
        let statsData = null;
        let ws = null;

        function initWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/api/ws/${surveyId}`);
            
            ws.onopen = () => {
                console.log('WebSocket 已连接');
                document.getElementById('liveIndicator').classList.remove('hidden');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'initial_stats' || data.type === 'stats_update') {
                    updateStats(data.data);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket 已断开');
                document.getElementById('liveIndicator').innerHTML = `
                    <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                    <span class="text-sm text-red-600">连接已断开，尝试重连...</span>
                `;
                setTimeout(initWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
            };
        }

        function updateStats(stats) {
            statsData = stats;
            document.getElementById('totalResponses').textContent = stats.total_responses;
            renderCharts(stats.question_stats);
        }

        function renderCharts(questionStats) {
            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';

            questionStats.forEach((qStats, index) => {
                const div = document.createElement('div');
                div.className = 'bg-white rounded-lg shadow-lg p-6';
                
                const chartIdPie = `chart-pie-${index}`;
                const chartIdBar = `chart-bar-${index}`;

                div.innerHTML = `
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">
                        ${index + 1}. ${qStats.question_text}
                        <span class="text-sm font-normal text-gray-500 ml-2">
                            (${qStats.question_type === 'single_choice' ? '单选题' : '多选题'})
                        </span>
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h4 class="text-sm font-semibold text-gray-600 mb-2 text-center">饼图</h4>
                            <canvas id="${chartIdPie}" height="200"></canvas>
                        </div>
                        <div>
                            <h4 class="text-sm font-semibold text-gray-600 mb-2 text-center">条形图</h4>
                            <canvas id="${chartIdBar}" height="200"></canvas>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-gray-600">
                                    <th class="text-left py-2">选项</th>
                                    <th class="text-right py-2">票数</th>
                                    <th class="text-right py-2">占比</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${Object.entries(qStats.option_counts).map(([opt, count]) => `
                                    <tr class="border-t">
                                        <td class="py-2">${opt}</td>
                                        <td class="text-right py-2 font-semibold">${count}</td>
                                        <td class="text-right py-2">${qStats.option_percentages[opt]}%</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                
                container.appendChild(div);

                setTimeout(() => {
                    createCharts(chartIdPie, chartIdBar, qStats);
                }, 100);
            });
        }

        function createCharts(pieId, barId, qStats) {
            const labels = Object.keys(qStats.option_counts);
            const data = Object.values(qStats.option_counts);
            const colors = [
                '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6',
                '#EC4899', '#06B6D4', '#84CC16', '#F97316', '#6366F1'
            ];

            const pieCtx = document.getElementById(pieId);
            if (pieCtx) {
                if (charts[pieId]) charts[pieId].destroy();
                charts[pieId] = new Chart(pieCtx, {
                    type: 'pie',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: colors.slice(0, labels.length)
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12 } }
                        }
                    }
                });
            }

            const barCtx = document.getElementById(barId);
            if (barCtx) {
                if (charts[barId]) charts[barId].destroy();
                charts[barId] = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '票数',
                            data: data,
                            backgroundColor: colors.slice(0, labels.length)
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1 } }
                        }
                    }
                });
            }
        }

        async function loadResults() {
            try {
                const [surveyRes, statsRes] = await Promise.all([
                    fetch(`/api/surveys/${surveyId}`),
                    fetch(`/api/analytics/${surveyId}`)
                ]);

                if (!surveyRes.ok) throw new Error('问卷不存在');
                
                const survey = await surveyRes.json();
                statsData = await statsRes.json();

                document.getElementById('surveyTitle').textContent = survey.title;
                document.getElementById('surveyDescription').textContent = survey.description || '暂无描述';
                
                updateStats(statsData);
                initWebSocket();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultsContainer').classList.remove('hidden');
            } catch (error) {
                showError(error.message);
            }
        }

        function exportCSV() {
            window.location.href = `/api/analytics/${surveyId}/export/csv`;
        }

        function copyShareLink() {
            const link = window.location.origin + '/survey/' + surveyId;
            navigator.clipboard.writeText(link).then(() => {
                alert('问卷链接已复制！');
            });
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }

        loadResults();
    </script>
</body>
</html>
