{% extends "base.html" %}
{% block title %}发布物品 - 二手交易平台{% endblock %}
{% block content %}
<div class="form-container">
    <h2>发布物品</h2>
    <form method="post" action="/items/create" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" name="title" required placeholder="物品标题" maxlength="100">
        </div>
        <div class="form-group">
            <label for="description">描述</label>
            <textarea id="description" name="description" rows="5" placeholder="详细描述物品状况..." maxlength="2000"></textarea>
        </div>
        <div class="form-group">
            <label for="price">价格（元）</label>
            <input type="number" id="price" name="price" required placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group">
            <label for="category">分类</label>
            <select id="category" name="category">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="image">图片（可选，最大5MB）</label>
            <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/webp">
        </div>
        <button type="submit" class="btn btn-primary btn-block">发布</button>
        <a href="/items/" class="btn btn-secondary btn-block" style="text-align:center;">取消</a>
    </form>
</div>
{% endblock %}
