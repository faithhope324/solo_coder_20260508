{% extends "base.html" %}
{% block title %}编辑物品 - 二手交易平台{% endblock %}
{% block content %}
<div class="form-container">
    <h2>编辑物品</h2>
    <form method="post" action="/items/{{ item.id }}/edit" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" name="title" required value="{{ item.title }}" maxlength="100">
        </div>
        <div class="form-group">
            <label for="description">描述</label>
            <textarea id="description" name="description" rows="5" maxlength="2000">{{ item.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="price">价格（元）</label>
            <input type="number" id="price" name="price" required value="{{ item.price }}" step="0.01" min="0">
        </div>
        <div class="form-group">
            <label for="category">分类</label>
            <select id="category" name="category">
                {% for cat in categories %}
                <option value="{{ cat }}" {% if cat == item.category %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="is_sold">状态</label>
            <select id="is_sold" name="is_sold">
                <option value="0" {% if item.is_sold == 0 %}selected{% endif %}>在售</option>
                <option value="1" {% if item.is_sold == 1 %}selected{% endif %}>已售出</option>
            </select>
        </div>
        <div class="form-group">
            <label>当前图片</label>
            {% if item.image_url %}
            <img src="/uploads/{{ item.image_url }}" alt="{{ item.title }}" class="preview-image">
            {% else %}
            <p class="text-muted">暂无图片</p>
            {% endif %}
            <label for="image">更换图片（可选）</label>
            <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/webp">
        </div>
        <button type="submit" class="btn btn-primary btn-block">保存修改</button>
        <a href="/items/{{ item.id }}" class="btn btn-secondary btn-block" style="text-align:center;">取消</a>
    </form>
</div>
{% endblock %}
